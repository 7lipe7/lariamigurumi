<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo Lari Amigurumi | Bonecos de Crochê</title>
    <meta name="description" content="Explore a coleção completa de amigurumis feitos à mão: ursinhos, coelhos, personagens, peixes, cactos e peças especiais. Encomende pelo WhatsApp!">
    <meta name="keywords" content="amigurumi, crochê, catálogo, ursinho, coelho, personagem, peixe, cacto, personalizado, presente">
    <meta property="og:title" content="Catálogo Lari Amigurumi | Bonecos de Crochê">
    <meta property="og:description" content="Explore a coleção completa de amigurumis feitos à mão. Encomende pelo WhatsApp!">
    <meta property="og:type" content="website">
    <link rel="shortcut icon" href="img/icon/capivara.png" type="image/x-icon">
    <link rel="stylesheet" href="style/catalago.css">
    <link rel="stylesheet" href="style/responsive.css">
    <script src="js/config.js"></script>
    <script src="js/comum.js" defer></script>
    <script src="js/catalago.js" defer></script>
    <script src="js/catalagoDinamico.js" defer></script>
</head>

<body>

<!-- Botão hambúrguer fixo no canto superior esquerdo -->
<button class="hamburger" id="hamburger" aria-label="Abrir menu de categorias" aria-expanded="false">
    <span></span>
    <span></span>
    <span></span>
</button>

<!-- Overlay para fechar a sidebar -->
<div class="overlay" id="overlay"></div>

<!-- Sidebar de filtros -->
<aside class="sidebar" id="sidebar" aria-hidden="true">
    <div class="sidebar-header">
        <h2>Filtrar por categoria</h2>
        <button class="btn-fechar" id="btn-fechar" aria-label="Fechar menu">&times;</button>
    </div>

    <div class="botoes" id="botoes">
        <div class="botao" data-filtro="todos"><button>Todos</button></div>
        <div class="botao" data-filtro="ursinhos"><button>Ursinhos</button></div>
        <div class="botao" data-filtro="coelhos"><button>Coelhos</button></div>
        <div class="botao" data-filtro="personagens"><button>Personagens</button></div>
        <div class="botao" data-filtro="peixes"><button>Peixes</button></div>
        <div class="botao" data-filtro="especial"><button>Especial</button></div>
    </div>
    
    
 <a href="index.html" class="btn btn-voltar-menu" id="btn-voltar">Voltar ao início</a>
     
   
</aside>

<div class="nav">
    <h1>Catálogo Completo</h1>
    <p>Explore nossa coleção de amigurumis feitos à mão, cada um com seu charme único e detalhes encantadores.</p>

    <div class="busca">
        <input
            type="search"
            id="busca"
            class="busca-input"
            placeholder="Buscar produto por nome..."
            autocomplete="off"
            aria-label="Buscar produto por nome"
        >
    </div>
</div>

<div class="main">

<div class="sem-resultados" id="sem-resultados">Nenhum produto encontrado para sua busca.</div>


</div>

<footer>
    <h2>Lari Amigurumi <img src="img/icon/capivara.png" alt="Logo Lari Amigurumi"></h2>
    <hr>
    <p>&copy; <span id="ano"></span> Lari Amigurumi. Todos os direitos reservados.</p>
</footer>

</body>
</html>
